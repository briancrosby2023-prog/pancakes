[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operation-pancake"
version = "0.1.0"
description = "Research and decision-support platform for EA Sports College Football Ultimate Team."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "Pillow>=10.0", "google-genai>=1.0"]

[project.scripts]
operation-pancake = "operation_pancake.cli:main"
operation-pancake-gm = "operation_pancake.gm_cli_entry:main"
operation-pancake-app = "operation_pancake.ocr_team_app_visual:main"
operation-pancake-ocr = "operation_pancake.ocr_runtime:diagnostic_line"

[project.optional-dependencies]
dev = ["beautifulsoup4>=4.12","pytest>=8.0","pytest-cov>=5.0","requests>=2.31","ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
