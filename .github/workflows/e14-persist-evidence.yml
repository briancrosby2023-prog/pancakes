name: E.14 Persist Evidence

on:
  push:
    branches:
      - 'agent/op-x-012-reconcile-artifacts'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Execute canonical E.14
        run: python scripts/run_cfb27_e14.py
      - name: Verify and persist evidence matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/research/cfb27_e14/evidence_matrix.json')
          if not path.exists() or path.stat().st_size == 0:
              raise SystemExit('E.14 evidence matrix missing or empty')
          data = json.loads(path.read_text(encoding='utf-8'))
          population = data.get('population', {})
          if population.get('input_records') != 8838 or population.get('eligible_records') != 8838:
              raise SystemExit(f'Unexpected E.14 population: {population}')
          if data.get('e15_started') is not False:
              raise SystemExit('E.15 boundary violated')
          required = {'BSH', 'PRC', 'SPD', 'PMV', 'FMV'}
          if set(data.get('components', {})) != required:
              raise SystemExit('E.14 component family mismatch')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/cfb27_e14/evidence_matrix.json
          if git diff --cached --quiet; then
            echo 'Canonical E.14 evidence already durable.'
          else
            git commit -m 'Persist canonical E.14 evidence matrix'
            git push
          fi
