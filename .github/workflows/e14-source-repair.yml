name: E.14 Source Repair

on:
  push:
    branches:
      - 'agent/op-x-012-reconcile-artifacts'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exclude undated cards from OP-X-003 trend slopes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/operation_pancake/research/cfb27_op_x_003.py')
          text = path.read_text(encoding='utf-8')
          old = '''        for card in cards\n        if attribute in card["displayed_ratings"]\n    ]\n    return _slope(pairs)'''
          new = '''        for card in cards\n        if card.get("release_date") and attribute in card["displayed_ratings"]\n    ]\n    return _slope(pairs)'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected _dated_slope source pattern not found')
          PY
          if git diff --quiet -- src/operation_pancake/research/cfb27_op_x_003.py; then
            echo 'OP-X-003 dated-slope repair already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/operation_pancake/research/cfb27_op_x_003.py
          git commit -m 'Skip undated cards in OP-X-003 trend slopes'
          git push
