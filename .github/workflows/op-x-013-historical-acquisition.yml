name: OP-X-013 Historical Database Acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - agent/op-x-012-reconcile-artifacts
    paths:
      - data/operational_memory/cfb26_launch_request.json

concurrency:
  group: op-x-013-historical-acquisition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/op-x-012-reconcile-artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run proven CFB27 population recipe for CFB26
        run: python scripts/run_cfb27_population_v3.py --season 26 --last-page 676
      - name: Persist CFB26 proven-path checkpoint
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/external/cfb_fan_26_population_v3_checkpoint.json \
                  data/external/cfb_fan_26_population_state.json \
                  data/external/raw/cfb_fan_26_global_listings 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint CFB26 proven-path population acquisition'
            git push origin HEAD:agent/op-x-012-reconcile-artifacts
          fi
      - name: Upload CFB26 acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op-x-013-cfb26-acquisition
          path: |
            data/external/cfb_fan_26_population_v3_checkpoint.json
            data/external/cfb_fan_26_population_state.json
            data/external/raw/cfb_fan_26_global_listings
          if-no-files-found: warn
