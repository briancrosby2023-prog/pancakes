name: OP-X-016 Historical TE Validation
on:
  workflow_dispatch:
  push:
    branches: [agent/op-x-012-reconcile-artifacts]
    paths:
      - src/operation_pancake/production/market_forecast.py
      - src/operation_pancake/production/recorder.py
      - src/operation_pancake/production/market_watch.py
      - tests/test_market_forecast.py
      - tests/test_op_x_038_recorder.py
      - tests/test_market_watch.py
      - .github/workflows/op-x-016-historical-te-validation.yml
permissions:
  contents: write
jobs:
  market-forecast-slice:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'MARKET-FORECAST-ACTIVATE') || contains(github.event.head_commit.message, 'PS5-MARKET-COLLECTOR-ACTIVATE')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/op-x-012-reconcile-artifacts, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Focused forecaster tests
        run: python -m pytest -q tests/test_market_forecast.py
      - name: PS5 recorder tests
        run: python -m pytest -q tests/test_op_x_038_recorder.py
      - name: Watcher and search queue tests
        run: python -m pytest -q tests/test_market_watch.py
      - name: Market regressions
        run: python -m pytest -q tests/test_market_production.py tests/test_op_x_029_market_campaign.py tests/test_op_x_036_monitor.py
      - name: Scoped market lint
        run: python -m ruff check --ignore E501 src/operation_pancake/production/market_watch.py tests/test_market_watch.py
      - name: Re-run market slice
        run: python -m pytest -q tests/test_market_forecast.py tests/test_op_x_038_recorder.py tests/test_market_watch.py tests/test_market_production.py tests/test_op_x_029_market_campaign.py tests/test_op_x_036_monitor.py
      - name: Deterministic queue dry run
        run: python -m pytest -q tests/test_market_watch.py -k search_queue_unknown_probability_stays_explore
      - name: Diff check
        run: git diff --check
