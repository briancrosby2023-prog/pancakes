name: OP-X-016 Historical TE Validation
on:
  workflow_dispatch:
  push:
    branches: [agent/op-x-012-reconcile-artifacts]
    paths:
      - scripts/op_x_016_historical_te_validation.py
      - tests/test_op_x_016_historical_te_validation.py
      - data/research/op_x_016/frozen_te_scoring_spec.json
      - scripts/run_op_x_051b.py
      - src/operation_pancake/gm_cli_entry.py
      - src/operation_pancake/production/role_intelligence.py
      - tests/test_op_x_051_role_intelligence.py
      - tests/test_op_x_051_cli.py
      - data/research/op_x_051/**
      - scripts/run_op_x_052.py
      - tests/test_op_x_052.py
      - data/research/op_x_052/**
      - data/research/op_x_053/**
      - .github/workflows/op-x-016-historical-te-validation.yml
permissions:
  contents: write
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'OP-X-016')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/op-x-012-reconcile-artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Targeted tests
        run: python -m pytest -q tests/test_op_x_016_historical_te_validation.py
      - name: Execute frozen historical TE models
        run: python scripts/op_x_016_historical_te_validation.py
      - name: Persist scientific results
        run: |
          git config user.name 'operation-pancake-bot'
          git config user.email 'operation-pancake-bot@users.noreply.github.com'
          git add -- data/research/op_x_016
          if ! git diff --cached --quiet; then git commit -m 'Persist OP-X-016 historical TE validation results'; git push origin HEAD:agent/op-x-012-reconcile-artifacts; fi

  op-x-051d-closure:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'OP-X-051D')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/op-x-012-reconcile-artifacts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Execute OP-X-051 population runner
        run: python scripts/run_op_x_051b.py
      - name: Focused OP-X-051 tests
        run: python -m pytest -q tests/test_op_x_051_role_intelligence.py tests/test_op_x_051_cli.py
      - name: Ruff OP-X-051 files
        run: python -m ruff check src/operation_pancake/production/role_intelligence.py src/operation_pancake/gm_cli_entry.py scripts/run_op_x_051b.py tests/test_op_x_051_role_intelligence.py tests/test_op_x_051_cli.py
      - name: Diff check
        run: git diff --check

  op-x-052a-closure:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'OP-X-052A')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/op-x-012-reconcile-artifacts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Execute OP-X-052 evidence resolution
        id: execute
        continue-on-error: true
        run: python scripts/run_op_x_052.py > /tmp/op_x_052.log 2>&1
      - name: Validate frozen invariants
        id: invariants
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          b=json.load(open('data/research/op_x_052/BASELINE.json'))
          assert b['canonical_population']==8838
          assert b['scoreable_population']==8184
          assert b['role_candidate_records']==26901
          assert b['moneyball_relationships']==2252
          assert b['op_x_051_inputs_regenerated'] is False
          PY
      - name: Focused OP-X-052 tests
        id: focused
        continue-on-error: true
        run: python -m pytest -q tests/test_op_x_052.py > /tmp/focused052.log 2>&1
      - name: OP-X-025 through OP-X-052 regressions
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          files=$(python - <<'PY'
          from pathlib import Path
          import re
          selected=[]
          for p in sorted(Path('tests').glob('test_op_x_*.py')):
              m=re.search(r'test_op_x_(\d+)', p.name)
              if m and 25 <= int(m.group(1)) <= 52:
                  selected.append(str(p))
          print(' '.join(selected))
          PY
          )
          test -n "$files"
          python -m pytest -q $files > /tmp/regressions052.log 2>&1
      - name: Deterministic artifact check
        id: deterministic
        continue-on-error: true
        run: |
          cp -a data/research/op_x_052 /tmp/opx052_before
          python scripts/run_op_x_052.py >/tmp/determinism052.log 2>&1
          diff -ru /tmp/opx052_before data/research/op_x_052 > /tmp/determinism052.diff
          test ! -s /tmp/determinism052.diff
      - name: Ruff OP-X-052 scope
        id: ruff
        continue-on-error: true
        run: python -m ruff check scripts/run_op_x_052.py tests/test_op_x_052.py > /tmp/ruff052.log 2>&1
      - name: Diff check
        id: diffcheck
        continue-on-error: true
        run: git diff --check > /tmp/diff052.log 2>&1
      - name: Persist OP-X-052 execution evidence
        if: always()
        env:
          EXECUTE: ${{ steps.execute.outcome }}
          INVARIANTS: ${{ steps.invariants.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          DETERMINISTIC: ${{ steps.deterministic.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path('data/research/op_x_052'); out.mkdir(parents=True,exist_ok=True)
          status={k.lower():os.environ[k] for k in ['EXECUTE','INVARIANTS','FOCUSED','REGRESSIONS','DETERMINISTIC','RUFF','DIFFCHECK']}
          (out/'ACTIONS_EXECUTION_STATUS.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'operation-pancake-bot'
          git config user.email 'operation-pancake-bot@users.noreply.github.com'
          git add -- data/research/op_x_052
          if ! git diff --cached --quiet; then
            git commit -m 'Persist OP-X-052A executed evidence resolution'
            git fetch origin agent/op-x-012-reconcile-artifacts
            git rebase origin/agent/op-x-012-reconcile-artifacts
            git push origin HEAD:agent/op-x-012-reconcile-artifacts
          fi
      - name: Upload OP-X-052 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op-x-052a-execution
          path: data/research/op_x_052
          if-no-files-found: error
      - name: Enforce OP-X-052 closure gates
        if: always()
        env:
          EXECUTE: ${{ steps.execute.outcome }}
          INVARIANTS: ${{ steps.invariants.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          DETERMINISTIC: ${{ steps.deterministic.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          test "$EXECUTE" = success
          test "$INVARIANTS" = success
          test "$FOCUSED" = success
          test "$REGRESSIONS" = success
          test "$DETERMINISTIC" = success
          test "$RUFF" = success
          test "$DIFFCHECK" = success

  op-x-053-closure:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'OP-X-053-ACTIVATE')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/op-x-012-reconcile-artifacts
          fetch-depth: 0
      - name: OP-X-053 activation placeholder
        run: echo 'OP-X-053 activation guard passed; scientific execution is not installed by OP-X-053B.'
