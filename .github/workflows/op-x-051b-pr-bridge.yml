name: OP-X-051B PR Bridge
on:
  pull_request:
    types: [reopened]
permissions:
  contents: write
jobs:
  execute:
    if: github.head_ref == 'agent/op-x-012-reconcile-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/op-x-012-reconcile-artifacts, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Fix role-alternative source and wire CLI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/operation_pancake/production/role_intelligence.py'); s=p.read_text(); s=s.replace('ta=target["card"].get("attributes") or target["card"].get("stats") or {}','ta=product.cards[card_id].get("attributes") or product.cards[card_id].get("stats") or {}'); p.write_text(s)
          p=Path('src/operation_pancake/gm_cli.py'); s=p.read_text()
          pm='    compare = sub.add_parser("compare")\n'
          pb='''    role_board_cmd = sub.add_parser("role-board")\n    role_board_cmd.add_argument("position")\n    role_board_cmd.add_argument("role")\n    role_board_cmd.add_argument("--limit", type=int, default=25)\n    role_alt_cmd = sub.add_parser("role-alternatives")\n    role_alt_cmd.add_argument("card_id")\n    role_alt_cmd.add_argument("role")\n    role_alt_cmd.add_argument("--limit", type=int, default=10)\n    sub.add_parser("roster-roles")\n    sub.add_parser("zero-coin-upgrades")\n    target_challenge_cmd = sub.add_parser("target-challenge")\n    target_challenge_cmd.add_argument("current_card_id")\n    target_challenge_cmd.add_argument("candidate_card_id")\n    target_challenge_cmd.add_argument("--role")\n'''
          if 'sub.add_parser("role-board")' not in s: s=s.replace(pm,pb+pm,1)
          hm='    elif args.command == "compare":\n'
          hb='''    elif args.command in {"role-board", "role-alternatives", "roster-roles", "zero-coin-upgrades", "target-challenge"}:\n        from operation_pancake.production.role_intelligence import role_board, role_alternatives\n        if args.command == "role-board": _dump(role_board(root,args.position.upper(),args.role.upper(),args.limit))\n        elif args.command == "role-alternatives": _dump(role_alternatives(root,args.card_id,args.role.upper(),args.limit))\n        elif args.command in {"roster-roles","zero-coin-upgrades"}:\n            fn="ROSTER_ROLE_MAP.json" if args.command=="roster-roles" else "ZERO_COIN_UPGRADES.json"\n            _dump(json.loads((root/"data/research/op_x_051"/fn).read_text()))\n        else:\n            gm=GMProduct(root); role=args.role.upper() if args.role else None\n            _dump({"comparison":gm.compare(args.current_card_id,args.candidate_card_id),"role":role,"role_alternatives":role_alternatives(root,args.candidate_card_id,role,10) if role else {"status":"DEPLOYMENT REQUIRED"},"buy_action":"UNCHANGED — MARKET CONTROLLED"})\n'''
          if 'args.command in {"role-board", "role-alternatives", "roster-roles"' not in s: s=s.replace(hm,hb+hm,1)
          p.write_text(s)
          PY
      - name: Execute OP-X-051B
        run: python scripts/run_op_x_051b.py | tee /tmp/execution.log
      - name: CLI smoke
        shell: bash
        run: |
          CID=$(python -c "import json;d=json.load(open('data/research/op_x_051/ROLE_BOARDS.json'));print(next(b['rows'][0]['card_id'] for b in d['boards'].values() if b['rows']))")
          operation-pancake-gm --root . context "$CID" >/dev/null
          operation-pancake-gm --root . role-board QB POCKET --limit 2 >/dev/null
          operation-pancake-gm --root . roster-roles >/dev/null
          operation-pancake-gm --root . zero-coin-upgrades >/dev/null
      - name: Focused
        run: pytest -q tests/test_op_x_051_role_intelligence.py | tee /tmp/focused.log
      - name: OP-X regressions
        shell: bash
        run: files=$(find tests -maxdepth 1 -type f -name 'test_op_x_*.py' | sort); pytest -q $files | tee /tmp/regressions.log
      - name: Determinism
        shell: bash
        run: cp -a data/research/op_x_051 /tmp/before && python scripts/run_op_x_051b.py >/dev/null && diff -ru /tmp/before data/research/op_x_051 | tee /tmp/determinism.log && test ! -s /tmp/determinism.log
      - name: Full pytest
        run: pytest -q | tee /tmp/full.log
      - name: Ruff
        run: python -m ruff check src/operation_pancake/production/role_intelligence.py src/operation_pancake/gm_cli.py scripts/run_op_x_051b.py tests/test_op_x_051_role_intelligence.py | tee /tmp/ruff.log
      - name: Diff check
        run: git diff --check | tee /tmp/diff.log
      - name: Persist quality and closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def r(p): return Path(p).read_text(errors='replace')[-5000:] if Path(p).exists() else 'NOT RUN'
          Path('data/research/op_x_051/QUALITY_GATES.md').write_text('# OP-X-051B Quality Gates\n\n## Focused\n```\n'+r('/tmp/focused.log')+'\n```\n## Regressions\n```\n'+r('/tmp/regressions.log')+'\n```\n## Full pytest\n```\n'+r('/tmp/full.log')+'\n```\n## Ruff\n```\n'+r('/tmp/ruff.log')+'\n```\n## Diff check\n```\n'+r('/tmp/diff.log')+'\n```\n## Determinism\n```\n'+(r('/tmp/determinism.log') or 'PASS: no diff')+'\n```\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/run_op_x_051b.py src/operation_pancake/production/role_intelligence.py src/operation_pancake/gm_cli.py data/research/op_x_051
          git commit -m 'Complete OP-X-051B execution closure' || true
          git push origin HEAD:agent/op-x-012-reconcile-artifacts
          git status --short --branch
