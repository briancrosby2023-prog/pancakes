name: GM Acceptance Repair
on:
  push:
    branches: [product/gm-app-mvp]
permissions: {contents: write}
jobs:
  repair:
    if: github.event.head_commit.message == 'Run GM replacement acceptance repair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - name: Add confirmed replacement surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/operation_pancake/app.py'); s=p.read_text()
          api='''            if p.path=="/api/gm": self._json({"budget":state.as_dict(),"decisions":[decisions.decision(a) for a in assignments()],"upgrades":decisions.opportunities(assignments(),state.prices,state.spendable_budget)}); return\n'''
          api_new=api+'''            if p.path=="/api/replacements":\n                a=assignment_by_slot(q.get("slot",[""])[0])\n                if not a: self._json({"error":"assignment not found"},404); return\n                self._json(decisions.detail(a,state.prices,state.spendable_budget)); return\n'''
          assert api in s and 'p.path=="/api/replacements"' not in s; s=s.replace(api,api_new)
          browser='''            if p.path=="/decision":\n'''
          repl='''            if p.path=="/replacements":\n                a=assignment_by_slot(q.get("slot",[""])[0])\n                if not a: self._send(_page("Replacements","<h1>Assignment not found</h1>"),404); return\n                d=decisions.detail(a,state.prices,state.spendable_budget); body=f'<h1>{html.escape(a.slot)} — replacements</h1><div class="card"><p>Current: {html.escape(d["current"]["player_name"])}</p><p>{html.escape(d["key_reason"])}</p></div>'\n                if not d["candidates"]: body+='<div class="card">No compatible higher-scored replacement candidates found.</div>'\n                else:\n                    body+='<table><tr><th>Candidate</th><th>Score gain</th><th>Rank gain</th><th>Price</th><th>Compare</th></tr>'\n                    for c in d["candidates"]: body+=f'<tr><td>{html.escape(c["player_name"])}</td><td>{_unknown(c.get("score_improvement"))}</td><td>{_unknown(c.get("position_rank_improvement"))}</td><td>{"PRICE UNKNOWN" if c.get("price") is None else f"{c["price"]:,} coins"}</td><td><a href="/compare?{urlencode({"current":a.card_id,"candidate":c["card_id"]})}">Compare</a></td></tr>'\n                    body+='</table>'\n                self._send(_page("Replacements",body)); return\n'''
          assert browser in s and 'p.path=="/replacements"' not in s; s=s.replace(browser,repl+browser); p.write_text(s)
          t=Path('tests/test_app.py'); x=t.read_text(); x+='''\n\ndef test_replacement_routes_are_registered():\n    import inspect\n    from operation_pancake.app import create_handler\n    src=inspect.getsource(create_handler)\n    assert 'p.path=="/replacements"' in src\n    assert 'p.path=="/api/replacements"' in src\n'''; t.write_text(x)
          PY
      - name: Regression tests
        run: python -m pytest -ra tests/test_app.py tests/test_evo.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/operation_pancake/app.py tests/test_app.py
          git commit -m 'Add replacement browser and API surfaces'
          git push origin HEAD:product/gm-app-mvp
