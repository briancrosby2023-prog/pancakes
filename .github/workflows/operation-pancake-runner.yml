name: Operation Pancake Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Show runner state
        run: |
          python --version
          git rev-parse HEAD
          git status --short
          python -m pip show operation-pancake pytest ruff

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run test suite
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -ra -vv 2>&1 | tee pytest-runner.log

      - name: Persist pytest diagnostics
        if: always()
        run: |
          {
            echo '# Operation Pancake runner diagnostics'
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo "Pytest outcome: ${{ steps.pytest.outcome }}"
            echo
            echo '```text'
            cat pytest-runner.log
            echo '```'
          } > runner-diagnostics.md

      - name: Verify Operation Pancake CLI
        if: steps.pytest.outcome == 'success'
        run: operation-pancake --help

      - name: Fail validation if pytest failed
        if: steps.pytest.outcome != 'success'
        run: exit 1
