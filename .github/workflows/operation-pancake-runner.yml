name: Operation Pancake Runner

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Show runner state
        run: |
          python --version
          git rev-parse HEAD
          git status --short
          python -m pip show operation-pancake pytest ruff

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run test suite
        run: python -m pytest -ra -vv

      - name: Verify Operation Pancake CLI
        run: operation-pancake --help
