name: Operation Pancake Runner

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

concurrency:
  group: pancake-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Show runner state
        run: |
          python --version
          git rev-parse HEAD
          git status --short
          python -m pip show operation-pancake pytest ruff

      - name: Run Ruff
        run: python -m ruff check .

      - name: Derive Alpha readiness
        run: |
          python scripts/generate_cfb27_alpha_readiness.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/research/cfb27_alpha/readiness.json').read_text())
          print(json.dumps({
              'alpha_population': p['alpha_population'],
              'formula_eligibility': p['formula_eligibility'],
              'focus_position_readiness': p['focus_position_readiness'],
              'natural_experiment_inventory': {
                  'same_ovr_archetype_cells': p['natural_experiment_inventory']['same_ovr_archetype_cells'],
                  'pairwise_comparisons': p['natural_experiment_inventory']['pairwise_comparisons'],
                  'richest_cells': p['natural_experiment_inventory']['richest_cells'][:10],
              },
          }, indent=2, sort_keys=True))
          PY

      - name: Run test suite
        run: python -m pytest -ra -vv

      - name: Verify Operation Pancake CLI
        run: operation-pancake --help
