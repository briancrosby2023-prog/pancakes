name: Operation Pancake Runner

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

concurrency:
  group: pancake-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  op-x-026-product-acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/op-x-012-reconcile-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Execute OP-X-026 product acceptance
        run: python scripts/run_op_x_026_product_acceptance.py
      - name: Run focused product tests
        run: python -m pytest -ra tests -k 'gm or roster or budget or market or role or knowledge'
      - name: Run full regression suite
        run: python -m pytest -ra
      - name: Run Ruff
        run: python -m ruff check .
      - name: Verify clean diff
        run: git diff --check
      - name: Persist OP-X-026 evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/op_x_026 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Persist OP-X-026 product acceptance evidence'
            git push origin HEAD:agent/op-x-012-reconcile-artifacts
          fi
      - name: Upload OP-X-026 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op-x-026-product-acceptance
          path: data/research/op_x_026
          if-no-files-found: warn
