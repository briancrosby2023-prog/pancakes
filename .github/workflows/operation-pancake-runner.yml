name: Operation Pancake Runner

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pancake-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  op-x-013-historical-acquisition:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/op-x-012-reconcile-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out acquisition branch
        uses: actions/checkout@v4
        with:
          ref: agent/op-x-012-reconcile-artifacts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install acquisition dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Acquire CFB26 full population
        run: python scripts/op_x_013_historical_acquisition.py --seasons 26 --pause 0.12
      - name: Persist CFB26 checkpoint
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/op_x_013 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint OP-X-013 CFB26 all-position acquisition'
            git push origin HEAD:agent/op-x-012-reconcile-artifacts
          fi
      - name: Acquire CFB25 full population
        run: python scripts/op_x_013_historical_acquisition.py --seasons 25 --pause 0.12
      - name: Persist CFB25 checkpoint
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/op_x_013 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint OP-X-013 CFB25 all-position acquisition'
            git push origin HEAD:agent/op-x-012-reconcile-artifacts
          fi
      - name: Upload historical acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op-x-013-cfb26-cfb25-acquisition
          path: data/research/op_x_013
          if-no-files-found: warn

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Show runner state
        run: |
          python --version
          git rev-parse HEAD
          git status --short
          python -m pip show operation-pancake pytest ruff
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run test suite
        run: python -m pytest -ra -vv
      - name: Verify Operation Pancake CLI
        run: operation-pancake --help
