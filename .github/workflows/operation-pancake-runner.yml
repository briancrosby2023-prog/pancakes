name: Operation Pancake Runner

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

concurrency:
  group: pancake-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Show runner state
        run: |
          python --version
          git rev-parse HEAD
          git status --short
          python -m pip show operation-pancake pytest ruff
      - name: Run Ruff
        run: python -m ruff check .
      - name: Derive Alpha diagnostics
        run: |
          python scripts/generate_cfb27_alpha_readiness.py
          python scripts/inspect_cfb27_v3_checkpoint.py
      - name: Execute E.14 evidence matrix
        run: python scripts/run_cfb27_e14.py
      - name: Publish research diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: cfb27-research-diagnostics
          path: |
            data/research/cfb27_alpha/readiness.json
            data/research/cfb27_alpha/v3_checkpoint_summary.json
            data/research/cfb27_e14/execution_discovery.json
            data/research/cfb27_e14/evidence_matrix.json
          if-no-files-found: error
      - name: Run test suite
        run: |
          set -o pipefail
          python -m pytest -ra -vv 2>&1 | tee pytest.log
      - name: Publish pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest.log
          if-no-files-found: error
      - name: Verify Operation Pancake CLI
        run: operation-pancake --help
