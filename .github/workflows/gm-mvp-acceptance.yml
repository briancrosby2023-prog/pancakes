name: GM MVP Acceptance
on:
  push:
    branches: [product/gm-app-mvp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: Record revision
        run: mkdir -p /tmp/a && git rev-parse HEAD | tee /tmp/a/sha.txt && python --version | tee /tmp/a/python.txt
      - name: Verify acceptance-only descendant
        run: test "$(git diff --name-only f001194cda95821cafd1cfef5a71b67c6c1ee9cd..HEAD)" = ".github/workflows/gm-mvp-acceptance.yml"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Focused pytest
        run: python -m pytest -ra tests/test_app.py tests/test_evo.py | tee /tmp/a/focused.txt
      - name: Related pytest
        run: python -m pytest -ra tests -k 'gm or roster or replacement or budget or production' | tee /tmp/a/related.txt
      - name: Start app
        run: |
          operation-pancake-app > /tmp/a/app.log 2>&1 & echo $! >/tmp/a/pid
          python - <<'PY'
          import time,urllib.request
          for _ in range(60):
            try:
              assert urllib.request.urlopen('http://127.0.0.1:8765/',timeout=2).status==200; print('STARTUP PASS'); break
            except Exception: time.sleep(1)
          else: raise SystemExit('startup failed')
          PY
      - name: HTTP API persistence
        run: |
          python - <<'PY' | tee /tmp/a/http.txt
          import json,pathlib,urllib.parse,urllib.request
          from operation_pancake.production.gm import GMProduct
          B='http://127.0.0.1:8765'
          def get(p,e=200):
            try:
              r=urllib.request.urlopen(B+p,timeout=20); b=r.read(); s=r.status
            except urllib.error.HTTPError as x: s=x.code; b=x.read()
            assert s==e,(p,s,b[:300]); print('GET',p,s); return b
          def post(p,d,e=200):
            q=urllib.request.Request(B+p,data=urllib.parse.urlencode(d).encode(),method='POST')
            try:
              r=urllib.request.urlopen(q,timeout=20); b=r.read(); s=r.status
            except urllib.error.HTTPError as x: s=x.code; b=x.read()
            assert s==e,(p,s,b[:300]); print('POST',p,s); return b
          for p in ['/','/roster','/compare','/gm','/evo','/api/roster','/api/gm','/api/evo']: assert get(p)
          gm=GMProduct(pathlib.Path.cwd()); c1,c2=gm.population[:2]; a,b=c1['card_id'],c2['card_id']; pos=c1.get('position') or ''
          page=get('/?'+urllib.parse.urlencode({'name':c1.get('player_name') or '','position':pos})).decode(); assert c1.get('player_name','') in page
          assert json.loads(get('/api/player?'+urllib.parse.urlencode({'card_id':a})))
          post('/api/roster',{'card_id':a,'position':pos,'slot':'TEST1','starter':'on','protected':'on'},201)
          assert json.loads(get('/api/roster'))['assignments'][0]['card_id']==a
          assert json.loads(get('/api/gm/decision?slot=TEST1')).get('decision')
          post('/api/gm/budget',{'current_coins':300000,'reserve_coins':50000}); assert json.loads(get('/api/gm'))['budget']['spendable_budget']==250000
          post('/api/gm/price',{'card_id':b,'price':12345}); assert get('/compare?'+urllib.parse.urlencode({'current':a,'candidate':b}))
          get('/api/gm/decision?slot=MISSING',404); get('/api/evo/candidates?evo_id=MISSING',404)
          post('/evo',{'name':'ACCEPTANCE TEST ONLY','target_ovr':99,'positions':pos,'ovr_min':0,'ovr_max':99,'notes':'synthetic software acceptance fixture'})
          eid=json.loads(get('/api/evo'))['definitions'][-1]['id']; assert 'candidates' in json.loads(get('/api/evo/candidates?'+urllib.parse.urlencode({'evo_id':eid,'ownership':'all'})))
          d=json.loads(get('/api/evo/candidate?'+urllib.parse.urlencode({'evo_id':eid,'card_id':a}))); assert d['projection']['production']['score'] is None
          for f in ['roster.json','gm.json','evo.json']:
            x=json.loads((pathlib.Path('.operation_pancake')/f).read_text()); assert x.get('version') is not None
          print('HTTP API PERSISTENCE PHASE PASS',a,b,eid)
          PY
      - name: Restart persistence
        run: |
          kill "$(cat /tmp/a/pid)" || true; sleep 1; operation-pancake-app >>/tmp/a/app.log 2>&1 &
          python - <<'PY' | tee /tmp/a/restart.txt
          import json,time,urllib.request
          for _ in range(60):
            try:
              d=json.load(urllib.request.urlopen('http://127.0.0.1:8765/api/roster',timeout=2)); assert d['assignments'][0]['slot']=='TEST1'; print('RESTART PASS'); break
            except Exception: time.sleep(1)
          else: raise SystemExit('restart failed')
          PY
      - name: Broad pytest bounded
        continue-on-error: true
        run: timeout 300 python -m pytest -ra | tee /tmp/a/broad.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: gm-mvp-acceptance, path: /tmp/a, if-no-files-found: warn}
