name: C3PO Clean Room Acceptance
on:
  push:
    branches: [product/c3po-clean-room-roster]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: Verify evidence ancestry
        run: git merge-base --is-ancestor 73edea3e2d82bb287da93e3cd25884cd98f0478d HEAD
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Source evidence, secondary provider, restart, and structural boundary
        run: python -m pytest -q tests/test_c3po_card_version_analyzer.py tests/test_c3po_clean_room_roster.py tests/test_c3po_source_evidence.py tests/test_cfb27_enrichment.py tests/test_cfb27_production_enrichment.py
      - name: Scoped Ruff
        run: python -m ruff check --ignore E501 src/operation_pancake/c3po_roster.py src/operation_pancake/c3po_roster_app.py src/operation_pancake/c3po_roster_page.py src/operation_pancake/c3po_card_version.py src/operation_pancake/c3po_source_evidence.py src/operation_pancake/cfb27_enrichment.py tests/test_c3po_card_version_analyzer.py tests/test_c3po_clean_room_roster.py tests/test_c3po_source_evidence.py tests/test_cfb27_enrichment.py tests/test_cfb27_production_enrichment.py
