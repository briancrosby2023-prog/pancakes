name: First PS5 Market Observation
on:
  push:
    branches: ['agent/op-x-012-reconcile-artifacts']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'PS5-BATCH-ACTIVATE')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/op-x-012-reconcile-artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Recover Supercharged production quality
        run: python scripts/analyze_supercharged_controls.py
      - name: Ruff analysis wrapper
        run: python -m ruff check scripts/analyze_supercharged_controls.py
      - name: Persist quality report
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/execution_loop/supercharged_quality_controls.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist Supercharged production quality controls'
            git push origin HEAD:agent/op-x-012-reconcile-artifacts
          fi
