name: GM Replacement Surface Check
on:
  push:
    branches: [product/gm-app-mvp]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - name: Check replacement browser and API surfaces
        run: |
          operation-pancake-app >/tmp/app.log 2>&1 &
          python - <<'PY'
          import pathlib,time,urllib.parse,urllib.request
          from operation_pancake.production.gm import GMProduct
          gm=GMProduct(pathlib.Path.cwd()); c=next(x for x in gm.population if gm.rank_by_id.get(x['card_id'],{}).get('score') is not None); B='http://127.0.0.1:8765'
          for _ in range(60):
            try: urllib.request.urlopen(B,timeout=2); break
            except Exception: time.sleep(1)
          d=urllib.parse.urlencode({'card_id':c['card_id'],'position':c.get('position') or '','slot':'TEST1','starter':'on'}).encode(); urllib.request.urlopen(urllib.request.Request(B+'/api/roster',data=d,method='POST')).read()
          for path in ['/replacements?slot=TEST1','/api/replacements?slot=TEST1']:
            try: r=urllib.request.urlopen(B+path,timeout=10); print(path,r.status); assert r.status==200
            except urllib.error.HTTPError as e: print(path,e.code); raise
          PY
