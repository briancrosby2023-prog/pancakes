name: GM Player UI Check
on:
  push:
    branches: [product/gm-app-mvp]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install -e '.[dev]'
      - name: Confirm player search renders score and rank
        run: |
          operation-pancake-app >/tmp/app.log 2>&1 &
          python - <<'PY'
          import pathlib,time,urllib.parse,urllib.request
          from operation_pancake.production.gm import GMProduct
          gm=GMProduct(pathlib.Path.cwd()); c=next(x for x in gm.population if gm.rank_by_id.get(x['card_id'],{}).get('score') is not None)
          url='http://127.0.0.1:8765/?'+urllib.parse.urlencode({'name':c.get('player_name') or '','position':c.get('position') or ''})
          for _ in range(60):
            try: page=urllib.request.urlopen(url,timeout=2).read().decode(); break
            except Exception: time.sleep(1)
          else: raise SystemExit('app did not start')
          expected_score=str(gm.rank_by_id[c['card_id']]['score']); expected_rank=str(gm.rank_by_id[c['card_id']]['position_rank'])
          print('CARD',c['card_id'],'EXPECTED SCORE',expected_score,'RANK',expected_rank)
          assert 'Pancake score' in page, 'player search does not label Pancake score'
          assert 'Position rank' in page, 'player search does not label position rank'
          assert expected_score in page and expected_rank in page
          PY
