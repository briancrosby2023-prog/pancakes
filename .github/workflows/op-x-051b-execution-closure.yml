name: OP-X-051B Execution Closure

on:
  workflow_dispatch:
  push:
    branches: ['agent/op-x-012-reconcile-artifacts']
    paths:
      - '.github/workflows/op-x-051b-execution-closure.yml'
      - 'scripts/run_op_x_051b.py'

permissions:
  contents: write

jobs:
  close-op-x-051b:
    if: ${{ !contains(github.event.head_commit.message, 'Complete OP-X-051B execution closure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/op-x-012-reconcile-artifacts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Apply narrow OP-X-051B defect correction and CLI wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/operation_pancake/production/role_intelligence.py')
          s=p.read_text()
          old='ta=target["card"].get("attributes") or target["card"].get("stats") or {}'
          new='ta=product.cards[card_id].get("attributes") or product.cards[card_id].get("stats") or {}'
          if old in s: s=s.replace(old,new)
          p.write_text(s)

          p=Path('src/operation_pancake/gm_cli.py'); s=p.read_text()
          parser_marker='    compare = sub.add_parser("compare")\n'
          parser_block='''    role_board_cmd = sub.add_parser("role-board")\n    role_board_cmd.add_argument("position")\n    role_board_cmd.add_argument("role")\n    role_board_cmd.add_argument("--limit", type=int, default=25)\n    role_alt_cmd = sub.add_parser("role-alternatives")\n    role_alt_cmd.add_argument("card_id")\n    role_alt_cmd.add_argument("role")\n    role_alt_cmd.add_argument("--limit", type=int, default=10)\n    sub.add_parser("roster-roles")\n    sub.add_parser("zero-coin-upgrades")\n    target_challenge_cmd = sub.add_parser("target-challenge")\n    target_challenge_cmd.add_argument("current_card_id")\n    target_challenge_cmd.add_argument("candidate_card_id")\n    target_challenge_cmd.add_argument("--role")\n'''
          if 'sub.add_parser("role-board")' not in s:
              if parser_marker not in s: raise SystemExit('CLI parser insertion marker missing')
              s=s.replace(parser_marker,parser_block+parser_marker,1)
          handler_marker='    elif args.command == "compare":\n'
          handler_block='''    elif args.command in {"role-board", "role-alternatives", "roster-roles", "zero-coin-upgrades", "target-challenge"}:\n        from operation_pancake.production.role_intelligence import role_board, role_alternatives\n        if args.command == "role-board":\n            _dump(role_board(root, args.position.upper(), args.role.upper(), args.limit))\n        elif args.command == "role-alternatives":\n            _dump(role_alternatives(root, args.card_id, args.role.upper(), args.limit))\n        elif args.command == "roster-roles":\n            path = root / "data/research/op_x_051/ROSTER_ROLE_MAP.json"\n            _dump(json.loads(path.read_text()) if path.exists() else {"status":"UNKNOWN","reason":"run OP-X-051B execution first"})\n        elif args.command == "zero-coin-upgrades":\n            path = root / "data/research/op_x_051/ZERO_COIN_UPGRADES.json"\n            _dump(json.loads(path.read_text()) if path.exists() else {"status":"UNKNOWN","reason":"run OP-X-051B execution first"})\n        else:\n            gm = GMProduct(root)\n            base = gm.compare(args.current_card_id, args.candidate_card_id)\n            role = args.role.upper() if args.role else None\n            _dump({"comparison":base,"role":role,"role_alternatives":role_alternatives(root,args.candidate_card_id,role,10) if role else {"status":"DEPLOYMENT REQUIRED"},"buy_action":"UNCHANGED — MARKET CONTROLLED"})\n'''
          if 'args.command in {"role-board", "role-alternatives", "roster-roles"' not in s:
              if handler_marker not in s: raise SystemExit('CLI handler insertion marker missing')
              s=s.replace(handler_marker,handler_block+handler_marker,1)
          p.write_text(s)
          PY
      - name: Execute population roster and target analysis
        run: python scripts/run_op_x_051b.py | tee /tmp/opx051b-execution.log
      - name: CLI smoke tests
        shell: bash
        run: |
          CID=$(python - <<'PY'
          import json
          d=json.load(open('data/research/op_x_051/ROLE_BOARDS.json'))
          for b in d['boards'].values():
              if b['rows']:
                  print(b['rows'][0]['card_id']); break
          PY
          )
          operation-pancake-gm --root . context "$CID" >/tmp/context.json
          operation-pancake-gm --root . role-board QB POCKET --limit 3 >/tmp/role-board.json
          operation-pancake-gm --root . role-alternatives "$CID" POCKET --limit 3 >/tmp/role-alt.json || true
          operation-pancake-gm --root . roster-roles >/tmp/roster-roles.json
          operation-pancake-gm --root . zero-coin-upgrades >/tmp/zero-coin.json
          python -m json.tool /tmp/context.json >/dev/null
          python -m json.tool /tmp/role-board.json >/dev/null
          python -m json.tool /tmp/roster-roles.json >/dev/null
          python -m json.tool /tmp/zero-coin.json >/dev/null
      - name: Focused OP-X-051 tests
        run: pytest -q tests/test_op_x_051_role_intelligence.py | tee /tmp/focused.log
      - name: OP-X-025 through OP-X-051 regressions
        shell: bash
        run: |
          files=$(find tests -maxdepth 1 -type f \( -name 'test_op_x_0*.py' -o -name 'test_op_x_*.py' \) | sort)
          if [ -n "$files" ]; then pytest -q $files | tee /tmp/regressions.log; else echo 'No OP-X named tests found' | tee /tmp/regressions.log; fi
      - name: Deterministic artifact checks
        shell: bash
        run: |
          cp -a data/research/op_x_051 /tmp/opx051-before
          python scripts/run_op_x_051b.py >/tmp/opx051b-rerun.log
          diff -ru /tmp/opx051-before data/research/op_x_051 | tee /tmp/determinism.diff
          test ! -s /tmp/determinism.diff
      - name: Full pytest
        run: pytest -q | tee /tmp/full-pytest.log
      - name: Ruff changed OP-X-051B files
        run: python -m ruff check src/operation_pancake/production/role_intelligence.py src/operation_pancake/gm_cli.py scripts/run_op_x_051b.py tests/test_op_x_051_role_intelligence.py | tee /tmp/ruff.log
      - name: Diff check
        run: git diff --check | tee /tmp/diff-check.log
      - name: Write quality gates
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def tail(p):
              q=Path(p); return q.read_text(errors='replace')[-4000:] if q.exists() else 'NOT RUN'
          text='''# OP-X-051B Quality Gates\n\nRepository-side execution closure.\n\n## Focused tests\n```\n%s\n```\n\n## OP-X regressions\n```\n%s\n```\n\n## Full pytest\n```\n%s\n```\n\n## Ruff\n```\n%s\n```\n\n## git diff --check\n```\n%s\n```\n\n## Determinism\n```\n%s\n```\n'''%(tail('/tmp/focused.log'),tail('/tmp/regressions.log'),tail('/tmp/full-pytest.log'),tail('/tmp/ruff.log'),tail('/tmp/diff-check.log'),tail('/tmp/determinism.diff') or 'PASS: no diff')
          Path('data/research/op_x_051/QUALITY_GATES.md').write_text(text)
          PY
      - name: Commit and push coherent closure
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/run_op_x_051b.py src/operation_pancake/production/role_intelligence.py src/operation_pancake/gm_cli.py data/research/op_x_051
          if ! git diff --cached --quiet; then
            git commit -m 'Complete OP-X-051B execution closure'
            git push origin HEAD:agent/op-x-012-reconcile-artifacts
          fi
          git rev-parse HEAD | tee /tmp/final-head.txt
          git status --short --branch | tee /tmp/final-status.txt
