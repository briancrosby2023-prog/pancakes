name: Operation Pancake SOP Gate

on:
  push:
    branches:
      - 'ops/sop-gate'
      - 'product/c3po-clean-room-roster'
  pull_request:
    branches:
      - 'product/c3po-clean-room-roster'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sop-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run SOP gate tests
        run: python -m pytest -q tests/test_sop_gate.py tests/test_sop_gateway.py tests/test_openai_decision_provider.py tests/test_pancake_control.py

      - name: Compile decision-control integration
        run: python -m py_compile src/operation_pancake/sop_policy.py src/operation_pancake/sop_gateway.py src/operation_pancake/openai_decision_provider.py src/operation_pancake/product_app.py src/operation_pancake/control_state.py scripts/pancake_control.py

      - name: Validate mission-specific SOP state
        run: python scripts/verify_sop_gate.py --state docs/SOP_STATE.json --action commit

      - name: Validate project-wide Operation Pancake control
        run: python scripts/pancake_control.py validate

      - name: Verify deterministic Operation Pancake handoff
        run: python scripts/pancake_control.py handoff --check docs/OPERATION_PANCAKE_HANDOFF.md
