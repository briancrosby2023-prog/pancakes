name: Operation Pancake SOP Gate

on:
  push:
    branches:
      - 'ops/sop-gate'
      - 'product/c3po-clean-room-roster'
  pull_request:
    branches:
      - 'product/c3po-clean-room-roster'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sop-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run SOP gate tests
        run: python -m pytest -q tests/test_sop_gate.py tests/test_sop_gateway.py

      - name: Validate repository SOP state
        run: python scripts/verify_sop_gate.py --state docs/SOP_STATE.json --action commit
